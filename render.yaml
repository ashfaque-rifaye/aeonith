# Render Blueprint: one web service. Secrets are entered in the Render dashboard (sync: false), never committed.
services:
  - type: web
    name: aeonith
    runtime: node
    plan: starter # paid from the $50 hackathon Render credits; never sleeps
    buildCommand: npm ci && npm run build:sdk && npm run typecheck
    startCommand: npm start
    healthCheckPath: /api/health
    disk: # keeps requests, Autopilot vault tokens and the audit chain across deploys
      name: aeonith-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: CURRENCY
        value: USD
      - key: MAX_AUTH_AMOUNT
        value: "1000"
      - key: AI_MODEL
        value: claude-opus-5-5
      - key: PROVIDER_PAYOUT_EMAIL
        value: sb-rds43c53656224@business.example.com
      - key: APP_BASE_URL
        sync: false # e.g. https://aeonith.onrender.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_TEXT_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: NVIDIA_VISION_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: NVIDIA_CREDITS
        sync: false # your current balance on build.nvidia.com
      - key: AG_GRID_LICENSE_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

  # A pro's own bidding agent, running independently and talking to Aeonith only through the
  # APIMatic-generated SDK over Render's private network (the same way any outside seller would).
  - type: worker
    name: aeonith-seller-agent
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:sdk
    startCommand: npx tsx scripts/seller-agent.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AEONITH_HOSTPORT
        fromService:
          type: web
          name: aeonith
          property: hostport
      - key: PROVIDER_ID
        value: sdk-hill-country
      - key: PROVIDER_NAME
        value: Hill Country Plumbing

  # PayPal holds are only guaranteed for 3 days: every 6 hours this job reauthorizes older holds and
  # releases holds on requests that closed with no winner.
  - type: cron
    name: aeonith-hold-sweeper
    runtime: node
    plan: starter
    schedule: "0 */6 * * *"
    buildCommand: npm ci
    startCommand: npx tsx scripts/sweep.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AEONITH_HOSTPORT
        fromService:
          type: web
          name: aeonith
          property: hostport
      - key: ADMIN_TOKEN
        fromService:
          type: web
          name: aeonith
          envVarKey: ADMIN_TOKEN
