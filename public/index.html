</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="ember-bg" aria-hidden="true"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd2b5"/><stop offset="1" stop-color="#ff7a3d"/></linearGradient></defs>
  </svg>

  <header class="topnav" id="topnav">
    <a class="logo" href="#/home" aria-label="Aeonith home">
      <svg viewBox="0 0 32 28" aria-hidden="true"><path d="M16 0 32 28H23.5L16 14.5 8.5 28H0Z" fill="currentColor"/><path d="M16 19.5 19.6 26H12.4Z" fill="currentColor"/></svg>

      <footer class="foot">PayPal sandbox · seller agents simulated · sample prices · not financial or legal advice</footer>
    </div>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main navigation"></nav>
  <div id="toast" role="status" aria-live="polite"></div>
  <span id="env-top" hidden></span>
